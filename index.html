<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarjetero de Etimología Médica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#17231F;
    --paper:#E7ECE3;
    --panel:#F5F7F1;
    --dark:#163430;
    --dark-2:#0E241F;
    --amber:#DDA23A;
    --sage:#5E8778;
    --clay:#A5522F;
    --line:#c7cfc0;
    --radius:22px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }

  /* ── LAYOUT BASE (MÓVIL) ── */
  .app{
    width:100%;
    max-width:520px;
    margin:0 auto;
    padding:calc(env(safe-area-inset-top) + 32px) 16px calc(env(safe-area-inset-bottom) + 48px);
    display:flex;
    flex-direction:column;
  }

  header{
    text-align:center;
    margin-bottom:18px;
  }
  header .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--sage);
  }
  header h1{
    font-family:'Zilla Slab',serif;
    font-weight:700;
    font-size:clamp(26px,6vw,34px);
    margin:4px 0 0;
    color:var(--dark-2);
  }

  /* ── SELECTOR MAZOS (MÓVIL: scroll) ── */
  .decks-wrap{
    position:relative;
    margin:20px 0 6px;
  }
  .decks{
    display:flex;
    gap:8px;
    overflow-x:auto;
    scroll-snap-type:x proximity;
    padding:2px 2px 10px;
    -ms-overflow-style:none;
    scrollbar-width:none;
  }
  .decks::-webkit-scrollbar{ display:none; }
  .decks button{
    flex:0 0 auto;
    scroll-snap-align:start;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
    width:72px;
    border:1px solid var(--line);
    background:var(--panel);
    padding:10px 4px 8px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:10px;
    line-height:1.2;
    color:var(--ink);
    border-radius:14px;
    cursor:pointer;
    transition:background .18s, color .18s, border-color .18s, box-shadow .18s;
  }
  .decks button:hover{
    border-color:var(--sage);
    box-shadow:0 0 0 3px rgba(94,135,120,.12);
  }
  .decks button svg{
    width:20px; height:20px;
    stroke:var(--sage);
    fill:none;
    stroke-width:1.6;
    stroke-linecap:round;
    stroke-linejoin:round;
    transition:stroke .18s;
  }
  .decks button.active{
    background:var(--dark);
    border-color:var(--dark);
    color:var(--paper);
    box-shadow:none;
  }
  .decks button.active svg{ stroke:var(--paper); }
  .deck-hint{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    color:#9aa79f;
    text-align:center;
    margin:-4px 0 10px;
  }

  /* ── META ROW ── */
  .meta-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    color:#4a5750;
    margin-bottom:10px;
    padding:0 4px;
  }
  .meta-row button{
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--ink);
    border-radius:8px;
    padding:6px 10px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    cursor:pointer;
  }
  .meta-row button:hover{ background:#fff; }

  /* ── CARD ── */
  .stage{
    perspective:1400px;
    margin-bottom:18px;
  }
  .card{
    position:relative;
    width:100%;
    min-height:300px;
    transform-style:preserve-3d;
    transition:transform .55s cubic-bezier(.2,.7,.3,1);
    cursor:pointer;
  }
  .card.flipped{ transform:rotateY(180deg); }
  .face{
    position:absolute;
    inset:0;
    -webkit-backface-visibility:hidden;
    backface-visibility:hidden;
    border-radius:var(--radius);
    display:flex;
    flex-direction:column;
    padding:28px 24px;
  }
  .front{
    background:var(--dark);
    color:var(--paper);
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:14px;
  }
  .front .term{
    font-family:'Zilla Slab',serif;
    font-weight:700;
    font-size:clamp(28px,7.5vw,40px);
    line-height:1.15;
    letter-spacing:.01em;
  }
  .front .hint{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:#9fb8ac;
  }
  .back{
    background:var(--panel);
    border:1px solid var(--line);
    transform:rotateY(180deg);
    justify-content:flex-start;
  }
  .answer-layout{
    display:grid;
    grid-template-columns:minmax(150px, 190px) minmax(0, 1fr);
    gap:22px;
    align-items:start;
  }
  .answer-content{
    min-width:0;
  }
  .clinical-visual{
    width:100%;
    aspect-ratio:1 / 1;
    border-radius:18px;
    overflow:hidden;
    background:var(--dark);
    border:1px solid rgba(94,135,120,.35);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .clinical-visual:empty{
    display:none;
  }
  .clinical-visual svg{
    display:block;
    width:100%;
    height:100%;
  }
  .back .term-sm{
    font-family:'Zilla Slab',serif;
    font-weight:600;
    font-size:19px;
    color:var(--dark-2);
    margin-bottom:14px;
  }
  .fragments{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:16px;
  }
  .frag{
    flex:1 1 auto;
    min-width:84px;
    border-radius:12px;
    padding:9px 11px 10px;
    background:#fff;
    border:1px solid var(--line);
    border-top:3px dashed var(--tagcolor);
  }
  .frag .piece{
    font-family:'Zilla Slab',serif;
    font-weight:700;
    font-size:17px;
    color:var(--ink);
  }
  .frag .tag{
    display:inline-block;
    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:#fff;
    background:var(--tagcolor);
    border-radius:5px;
    padding:1px 6px;
    margin-top:6px;
    margin-bottom:4px;
  }
  .frag .meaning{
    font-size:12.5px;
    color:#3d493f;
    display:block;
  }
  .frag.prefijo{ --tagcolor:var(--amber); }
  .frag.raiz{ --tagcolor:var(--sage); }
  .frag.sufijo{ --tagcolor:var(--clay); }
  .suture{
    border-top:1px dashed var(--line);
    margin:2px 0 14px;
  }
  .definition .label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--sage);
    display:block;
    margin-bottom:4px;
  }
  .definition p{
    font-family:'Inter',sans-serif;
    font-size:15.5px;
    line-height:1.45;
    margin:0;
    color:var(--dark-2);
  }
  .flip-note{
    text-align:center;
    font-size:11px;
    font-family:'IBM Plex Mono',monospace;
    color:#8a978e;
    margin:-6px 0 18px;
  }
  .progress{
    display:flex;
    justify-content:center;
    gap:6px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .progress .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--line);
  }
  .progress .dot.done{ background:var(--sage); }
  .progress .dot.current{ background:var(--dark); transform:scale(1.3); }
  .nav{
    display:flex;
    gap:10px;
  }
  .nav button{
    flex:1;
    padding:13px 10px;
    border-radius:12px;
    border:1px solid var(--dark);
    background:var(--dark);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    transition:opacity .15s;
  }
  .nav button:hover{ opacity:.85; }
  .nav button.ghost{
    background:transparent;
    color:var(--dark);
  }
  .nav button:active{ transform:translateY(1px); }
  .nav button:focus-visible, .decks button:focus-visible, .meta-row button:focus-visible{
    outline:2px solid var(--clay);
    outline-offset:2px;
  }
  @media (prefers-reduced-motion: reduce){
    .card{ transition:none; }
  }
  footer{
    margin-top:26px;
  }

  .sidebar{display:none;}

  footer{
    margin-top:26px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:#8a978e;
    text-align:center;
  }


  /* ── AJUSTES RESPONSIVOS PARA MÓVIL ── */
  @media (max-width:899px){
    header{
      padding-top:8px;
    }

    .stage{
      margin-bottom:18px;
    }

    .card{
      min-height:360px;
      height:360px;
    }

    .face{
      padding:24px 20px 28px;
    }

    .answer-layout{
      grid-template-columns:1fr;
      gap:16px;
    }

    .clinical-visual{
      width:min(100%, 260px);
      margin:0 auto;
    }

    .back{
      overflow-y:auto;
      overscroll-behavior:contain;
      -webkit-overflow-scrolling:touch;
    }

    .definition{
      margin-top:4px;
      padding-bottom:4px;
    }

    .definition .label{
      margin-bottom:8px;
    }

    .definition p{
      font-size:16px;
      line-height:1.6;
      overflow-wrap:anywhere;
      word-break:normal;
      hyphens:auto;
    }

    .flip-note{
      margin-top:4px;
      line-height:1.5;
    }
  }

  /* ════════════════════════════════════════════════
     ESCRITORIO ≥ 900px  — layout de dos columnas
  ════════════════════════════════════════════════ */
  @media (min-width:900px){

    body{
      background: linear-gradient(135deg, #d4dcd1 0%, #e7ece3 60%);
      display:grid;
      place-items:start center;
      padding:40px 32px 60px;
    }

    .app{
      max-width:1100px;
      padding:0;
      display:grid;
      grid-template-columns:260px 1fr;
      grid-template-rows:auto 1fr auto;
      grid-template-areas:
        "header  header"
        "sidebar main"
        "footer  footer";
      gap:0 32px;
    }

    /* ENCABEZADO ancho completo */
    header{
      grid-area:header;
      text-align:left;
      margin-bottom:28px;
      padding-bottom:20px;
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:baseline;
      gap:20px;
    }
    header h1{ font-size:32px; margin:0; }
    header .eyebrow{ font-size:11px; white-space:nowrap; }

    /* SIDEBAR izquierdo con todos los mazos */
    .sidebar{
      display:flex;
      grid-area:sidebar;
      background:#fff;
      border:1px solid var(--line);
      border-radius:20px;
      padding:20px 14px;
      display:flex;
      flex-direction:column;
      gap:6px;
      align-self:start;
      position:sticky;
      top:40px;
      max-height:calc(100vh - 100px);
      overflow-y:auto;
      scrollbar-width:thin;
      scrollbar-color: var(--line) transparent;
    }
    .sidebar-title{
      font-family:'IBM Plex Mono',monospace;
      font-size:10px;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:var(--sage);
      padding:0 6px 8px;
      border-bottom:1px solid var(--line);
      margin-bottom:4px;
    }
    .sidebar-btn{
      display:flex;
      align-items:center;
      gap:10px;
      width:100%;
      border:1px solid transparent;
      background:transparent;
      padding:9px 10px;
      font-family:'Inter',sans-serif;
      font-weight:500;
      font-size:13px;
      color:var(--ink);
      border-radius:10px;
      cursor:pointer;
      text-align:left;
      transition:background .15s, border-color .15s, color .15s;
    }
    .sidebar-btn svg{
      flex:0 0 18px;
      width:18px; height:18px;
      stroke:var(--sage);
      fill:none;
      stroke-width:1.6;
      stroke-linecap:round;
      stroke-linejoin:round;
      transition:stroke .15s;
    }
    .sidebar-btn:hover{
      background:var(--paper);
      border-color:var(--line);
    }
    .sidebar-btn.active{
      background:var(--dark);
      color:var(--paper);
      border-color:var(--dark);
      font-weight:600;
    }
    .sidebar-btn.active svg{ stroke:var(--paper); }
    .sidebar-count{
      margin-left:auto;
      font-family:'IBM Plex Mono',monospace;
      font-size:10px;
      color:#8a978e;
      flex-shrink:0;
    }
    .sidebar-btn.active .sidebar-count{ color:#9fb8ac; }

    /* ÁREA PRINCIPAL */
    .main-area{
      grid-area:main;
      display:flex;
      flex-direction:column;
    }

    /* Ocultar selector de chips en escritorio */
    .decks-wrap, .deck-hint{ display:none !important; }

    .meta-row{
      font-size:13px;
      margin-bottom:14px;
      padding:0;
    }
    .meta-row button{
      padding:8px 14px;
      font-size:12px;
      border-radius:10px;
    }

    .stage{ margin-bottom:22px; }
    .card{ min-height:380px; }
    .face{ padding:40px 48px; }
    .front .term{ font-size:clamp(36px,4vw,52px); }
    .front .hint{ font-size:13px; }
    .back .term-sm{ font-size:22px; margin-bottom:20px; }
    .clinical-visual{ max-width:190px; }
    .frag{ min-width:100px; padding:11px 14px 12px; }
    .frag .piece{ font-size:19px; }
    .frag .tag{ font-size:10px; }
    .frag .meaning{ font-size:13.5px; }
    .definition p{ font-size:17px; line-height:1.5; }

    .flip-note{ font-size:12px; margin-bottom:20px; }

    .progress{ gap:7px; margin-bottom:22px; }
    .progress .dot{ width:8px; height:8px; }

    .nav button{
      padding:15px 10px;
      font-size:15px;
      border-radius:14px;
    }

    footer{
      grid-area:footer;
      margin-top:32px;
      font-size:12px;
    }
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <span class="eyebrow">Tópicos de Salud · Raíces Grecolatinas</span>
    <h1>Tarjetero de Etimología Médica</h1>
  </header>

  <!-- SIDEBAR (solo visible en escritorio) -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-title">Mazos</div>
  </aside>

  <!-- ÁREA PRINCIPAL -->
  <div class="main-area">

    <div class="decks-wrap">
      <div class="decks" id="deckSwitch"></div>
    </div>
    <div class="deck-hint">◁ desliza para ver los 14 mazos ▷</div>

    <div class="meta-row">
      <span id="counter">1 / 5</span>
      <button id="shuffleBtn">⤮ Mezclar</button>
    </div>

    <div class="stage">
      <div class="card" id="card">
        <div class="face front">
          <div class="term" id="termFront"></div>
          <div class="hint">Clic para descifrar el significado</div>
        </div>
        <div class="face back">
          <div class="term-sm" id="termBack"></div>
          <div class="answer-layout">
            <div class="clinical-visual" id="clinicalVisual" aria-hidden="true"></div>
            <div class="answer-content">
              <div class="fragments" id="fragments"></div>
              <div class="suture"></div>
              <div class="definition">
                <span class="label">Significado</span>
                <p id="definition"></p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="flip-note">clic / toque = voltear · ← → = navegar · espacio = voltear</div>

    <div class="progress" id="progress"></div>

    <div class="nav">
      <button class="ghost" id="prevBtn">◁ Anterior</button>
      <button id="nextBtn">Siguiente ▷</button>
    </div>

  </div><!-- /main-area -->

  <footer>Basado en NOM-004-SSA3-2012 · raíces griegas y latinas de uso clínico</footer>
</div>

<script>
const CARD_SVGS = {

        {tag:"sufijo",piece:"-logía",meaning:"estudio"} ]},
      { term:"Antiséptico", def:"Sustancia que destruye los microorganismos e impide su crecimiento.", parts:[
        {tag:"prefijo",piece:"anti-",meaning:"contra"},
        {tag:"raiz",piece:"séptico",meaning:"sepsis, putrefacción"} ]},
      { term:"Asepsia", def:"Ausencia de microorganismos causantes de una enfermedad.", parts:[
        {tag:"prefijo",piece:"a-",meaning:"sin"},
        {tag:"raiz",piece:"sepsis",meaning:"putrefacción"} ]},
      { term:"Septicemia", def:"Presencia de gérmenes patógenos y sus toxinas en la sangre circulante.", parts:[
        {tag:"raiz",piece:"sept-",meaning:"putrefacción"},
        {tag:"sufijo",piece:"-emia",meaning:"sangre"} ]},
      { term:"Toxicosis", def:"Estado morboso debido a un veneno.", parts:[
        {tag:"raiz",piece:"toxi-",meaning:"veneno, intoxicación"},
        {tag:"sufijo",piece:"-osis",meaning:"condición"} ]},
      { term:"Zoonosis", def:"Enfermedad de animales que se puede transmitir al hombre.", parts:[
        {tag:"raiz",piece:"zoo-",meaning:"animal"},
        {tag:"sufijo",piece:"-nosis",meaning:"enfermedad"} ]},

  },
  tumores: {
    label: "Tumores",
    cards: [
      { term:"Osteoma", def:"Tumor benigno del tejido óseo.", parts:[

        {tag:"sufijo",piece:"-oma",meaning:"tumoración"} ]},
      { term:"Fibroma", def:"Tumor benigno de tejido fibroso.", parts:[
        {tag:"raiz",piece:"fibro-",meaning:"tejido fibroso"},
        {tag:"sufijo",piece:"-oma",meaning:"tumoración"} ]},
      { term:"Hemangioma", def:"Tumor benigno compuesto por vasos sanguíneos dilatados.", parts:[
        {tag:"raiz",piece:"hem-",meaning:"sangre"},
        {tag:"raiz",piece:"angio-",meaning:"vaso"},
        {tag:"sufijo",piece:"-oma",meaning:"tumoración"} ]},
      { term:"Adenocarcinoma", def:"Tumor maligno de origen glandular.", parts:[
        {tag:"raiz",piece:"adeno-",meaning:"glándula"},
        {tag:"raiz",piece:"carcino-",meaning:"cáncer"},
        {tag:"sufijo",piece:"-oma",meaning:"tumoración"} ]},
      { term:"Osteosarcoma", def:"Tumor maligno del tejido óseo.", parts:[
        {tag:"raiz",piece:"osteo-",meaning:"hueso"},
        {tag:"raiz",piece:"sarco-",meaning:"tejido conectivo, carne"},
        {tag:"sufijo",piece:"-oma",meaning:"tumoración"} ]},
      { term:"Glioma", def:"Tumor maligno formado por células del tejido cerebral.", parts:[
        {tag:"raiz",piece:"glio-",meaning:"tejido cerebral (neuroglia)"},
        {tag:"sufijo",piece:"-oma",meaning:"tumoración"} ]},
      { term:"Mieloma", def:"Tumor maligno formado por células de la médula ósea.", parts:[
        {tag:"raiz",piece:"mielo-",meaning:"médula ósea"},

let currentDeck = "endocrinologia";
let order = [];
let index = 0;
let flipped = false;

const deckSwitch = document.getElementById('deckSwitch');
const card = document.getElementById('card');
const termFront = document.getElementById('termFront');
const termBack = document.getElementById('termBack');
const fragmentsEl = document.getElementById('fragments');
const definitionEl = document.getElementById('definition');
const clinicalVisualEl = document.getElementById('clinicalVisual');
const counterEl = document.getElementById('counter');
const progressEl = document.getElementById('progress');

function buildDeckSwitch(){
  deckSwitch.innerHTML = '';
  const sidebar = document.getElementById('sidebar');
  // keep the title, remove old buttons
  sidebar.querySelectorAll('.sidebar-btn').forEach(b => b.remove());

  Object.keys(DECKS).forEach(key=>{
    const icon = ICONS[key] || '';
    const count = DECKS[key].cards.length;

    // ── chip (móvil) ──
    const btn = document.createElement('button');
    btn.innerHTML = `<svg viewBox="0 0 24 24">${icon}</svg><span>${DECKS[key].label}</span>`;
    btn.className = key === currentDeck ? 'active' : '';
    btn.onclick = () => { currentDeck = key; resetDeck(); };
    deckSwitch.appendChild(btn);

    // ── sidebar row (escritorio) ──
    const sb = document.createElement('button');
    sb.className = 'sidebar-btn' + (key === currentDeck ? ' active' : '');
    sb.innerHTML = `<svg viewBox="0 0 24 24">${icon}</svg><span>${DECKS[key].label}</span><span class="sidebar-count">${count}</span>`;
    sb.onclick = () => { currentDeck = key; resetDeck(); };
    sidebar.appendChild(sb);
  });
}

function resetDeck(){
  order = DECKS[currentDeck].cards.map((_,i)=>i);
  index = 0;
  flipped = false;
  card.classList.remove('flipped');
  buildDeckSwitch();
  render();
}

function shuffle(){
  for(let i=order.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [order[i],order[j]] = [order[j],order[i]];
  }
  index = 0;
  flipped = false;
  card.classList.remove('flipped');
  render();
}

function render(){
  const deck = DECKS[currentDeck].cards;
  const c = deck[order[index]];

  termFront.textContent = c.term;
  termBack.textContent = c.term;
  definitionEl.textContent = c.def;

  const svg = CARD_SVGS[c.term];
  if(svg){
    clinicalVisualEl.innerHTML = svg;
    clinicalVisualEl.setAttribute('aria-label', `Ilustración clínica de ${c.term}`);
    clinicalVisualEl.setAttribute('role', 'img');
  }else{
    clinicalVisualEl.innerHTML = '';
    clinicalVisualEl.removeAttribute('aria-label');
    clinicalVisualEl.removeAttribute('role');
  }

  fragmentsEl.innerHTML = '';
  c.parts.forEach(p=>{
    const div = document.createElement('div');
    div.className = 'frag ' + p.tag;
    div.innerHTML = `<span class="piece">${p.piece}</span><br>
      <span class="tag">${p.tag === 'prefijo' ? 'Prefijo' : p.tag === 'sufijo' ? 'Sufijo' : 'Raíz'}</span>
      <span class="meaning">${p.meaning}</span>`;
    fragmentsEl.appendChild(div);
  });

  counterEl.textContent = `${index+1} / ${deck.length}`;

  progressEl.innerHTML = '';
  deck.forEach((_,i)=>{
    const dot = document.createElement('div');
    dot.className = 'dot' + (i===index ? ' current' : i<index ? ' done' : '');
    progressEl.appendChild(dot);
  });

  adjustCardHeight();
}

card.addEventListener('click', ()=>{
  flipped = !flipped;
  card.classList.toggle('flipped', flipped);
  adjustCardHeight();
});

document.getElementById('nextBtn').onclick = ()=>{
  const len = DECKS[currentDeck].cards.length;
  index = (index+1) % len;
  flipped = false;
  card.classList.remove('flipped');
  render();
};
document.getElementById('prevBtn').onclick = ()=>{
  const len = DECKS[currentDeck].cards.length;
  index = (index-1+len) % len;
  flipped = false;
  card.classList.remove('flipped');
  render();
};
document.getElementById('shuffleBtn').onclick = shuffle;

document.addEventListener('keydown', (e)=>{
  if(e.key === 'ArrowRight') document.getElementById('nextBtn').click();
  if(e.key === 'ArrowLeft') document.getElementById('prevBtn').click();
  if(e.key === ' '){ e.preventDefault(); card.click(); }
});


function adjustCardHeight(){
  const frontFace = card.querySelector('.front');
  const backFace = card.querySelector('.back');
  const desktop = window.matchMedia('(min-width: 900px)').matches;
  const baseHeight = desktop ? 380 : 360;

  // Restablecer primero permite medir correctamente el contenido actual.
  card.style.height = baseHeight + 'px';

  requestAnimationFrame(() => {
    const frontHeight = frontFace ? frontFace.scrollHeight : baseHeight;
    const backHeight = backFace ? backFace.scrollHeight : baseHeight;
    const requiredHeight = Math.max(baseHeight, frontHeight, backHeight);
    card.style.height = requiredHeight + 'px';
  });
}

window.addEventListener('resize', adjustCardHeight);

resetDeck();
</script>
